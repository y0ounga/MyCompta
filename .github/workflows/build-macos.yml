name: Build macOS App for MyCompta

on:
  workflow_dispatch:

jobs:
  build-macos:
    # ⭐ macOS 13 (Ventura) → compatible avec les vieux macOS
    runs-on: macos-13

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # ⭐ Java 17.0.9 → dernière version supportant macOS 10.15
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17.0.9'

      - name: Créer l'app macOS avec jpackage
        working-directory: build
        run: |
          jpackage \
            --input . \
            --dest ../output \
            --name "MyCompta" \
            --main-jar "MyCompta.jar" \
            --main-class "MyComptaApp.main" \
            --type app-image \
            --app-version "1.0.0" \
            --vendor "AMIX Groupe"

      - name: Zipper l'application
        run: |
          cd output
          zip -r MyCompta-macOS.zip MyCompta.app

      - name: Uploader l'application
        uses: actions/upload-artifact@v4
        with:
          name: MyCompta-macOS
          path: ./output/MyCompta-macOS.zip
